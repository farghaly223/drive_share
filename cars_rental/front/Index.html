<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Rental | Browse Fleet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
        }

        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1500');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 80px 0;
            margin-bottom: 40px;
        }

        .filter-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-top: -60px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }

        .car-card {
            border: none;
            border-radius: 12px;
            transition: 0.3s;
            height: 100%;
            background: white;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

            .car-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            }

        .car-img {
            height: 200px;
            object-fit: cover;
        }

        .price-tag {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0d6efd;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="hero-bg text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Find Your Perfect Ride</h1>
            <p class="lead">Premium car rentals at the best prices</p>
        </div>
    </div>

    <div class="container">
        <div class="filter-section mb-5">
            <div class="row g-2">
                <div class="col-md-3">
                    <input type="text" id="searchBox" class="form-control" placeholder="Brand or Model...">
                </div>
                <div class="col-md-2">
                    <input type="text" id="locationBox" class="form-control" placeholder="Location...">
                </div>
                <div class="col-md-2">
                    <select id="carTypeSelect" class="form-select">
                        <option value="">All Types</option>
                        <option value="Sedan">Sedan</option>
                        <option value="SUV">SUV</option>
                        <option value="Sports">Sports</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" id="maxPrice" class="form-control" placeholder="Max Price">
                </div>
                <div class="col-md-2">
                    <select id="transmission" class="form-select">
                        <option value="">Gearbox</option>
                        <option value="automatic">Automatic</option>
                        <option value="manual">Manual</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-primary w-100" onclick="loadCars()">Search</button>
                </div>
            </div>
        </div>

        <div id="loading" class="text-center d-none py-5">
            <div class="spinner-border text-primary" role="status"></div>
        </div>

        <div class="row g-4 mb-5" id="carsContainer"></div>
    </div>

    <div class="modal fade" id="carDetailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" style="border-radius: 15px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modalTitle">Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalContent"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const BASE_URL = 'https://localhost:7208/api/Browsing';

        async function loadCars() {
            const container = document.getElementById('carsContainer');
            const loader = document.getElementById('loading');

            const search = document.getElementById('searchBox').value;
            const location = document.getElementById('locationBox').value;
            const carType = document.getElementById('carTypeSelect').value;
            const price = document.getElementById('maxPrice').value;
            const trans = document.getElementById('transmission').value;

            loader.classList.remove('d-none');
            container.innerHTML = '';

            try {
                let url = `${BASE_URL}/filter?search=${search}&location=${location}&carType=${carType}&maxPrice=${price}&transmission=${trans}`;
                const response = await fetch(url);
                const cars = await response.json();
                loader.classList.add('d-none');

                cars.forEach(car => {
                    const carCard = `
                            <div class="col-md-4">
                                <div class="card car-card">
                                    <span class="badge status-badge bg-success">Available</span>
                                    <img src="${car.mainImageUrl || 'https://via.placeholder.com/400x250'}" class="card-img-top car-img" alt="${car.brand}">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <h5 class="fw-bold mb-0">${car.brand} ${car.model}</h5>
                                            <span class="text-muted small">${car.year}</span>
                                        </div>
                                        <p class="text-secondary small mb-1">Location: ${car.location}</p>
                                        <p class="text-secondary small">Type: ${car.carType}</p>
                                        <hr>
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span class="price-tag">$${car.rentalPrice}<small class="text-muted fw-normal" style="font-size: 0.7rem"> /day</small></span>
                                            <button class="btn btn-primary btn-sm rounded-pill px-3" onclick="showDetails(${car.id})">Details</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    container.innerHTML += carCard;
                });
            } catch (e) { loader.classList.add('d-none'); }
        }

        async function showDetails(id) {
            try {
                const response = await fetch(`${BASE_URL}/${id}`);
                const car = await response.json();

                document.getElementById('modalTitle').innerText = `${car.brand} ${car.model} (${car.year})`;
                document.getElementById('modalContent').innerHTML = `
                        <div class="row">
                            <div class="col-md-6">
                                <img src="${car.mainImageUrl || 'https://via.placeholder.com/400x250'}" class="img-fluid rounded shadow-sm mb-3">
                            </div>
                            <div class="col-md-6">
                                <h3 class="text-primary fw-bold mb-3">$${car.rentalPrice} <small class="text-muted fs-6">Daily Fee</small></h3>
                                <ul class="list-group list-group-flush mb-3">
                                    <li class="list-group-item px-0 d-flex justify-content-between"><strong>Owner:</strong> <span>${car.ownerName}</span></li>
                                    <li class="list-group-item px-0 d-flex justify-content-between"><strong>Location:</strong> <span>${car.location}</span></li>
                                    <li class="list-group-item px-0 d-flex justify-content-between"><strong>Type:</strong> <span>${car.carType}</span></li>
                                    <li class="list-group-item px-0 d-flex justify-content-between"><strong>Gearbox:</strong> <span>${car.transmission}</span></li>
                                </ul>
                                <p class="small text-muted"><strong>Description:</strong> ${car.description || 'No additional details.'}</p>
                                <div class="p-3 bg-light rounded mt-3">
                                    <label class="small fw-bold mb-2">Check Dates:</label>
                                    <div class="d-flex gap-2 mb-3">
                                        <input type="date" class="form-control form-control-sm">
                                        <input type="date" class="form-control form-control-sm">
                                    </div>
                                    <button class="btn btn-success w-100 fw-bold" onclick="alert('Request Sent!')">Request Rental</button>
                                </div>
                            </div>
                        </div>
                    `;
                new bootstrap.Modal(document.getElementById('carDetailsModal')).show();
            } catch (e) { alert("Error loading details"); }
        }

        window.onload = loadCars;
    </script>
</body>
</html>
