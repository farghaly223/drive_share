<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Rental | عرض السيارات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7f6;
        }

        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1500');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 80px 0;
            margin-bottom: 40px;
        }

        .car-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            height: 100%;
        }

            .car-card:hover {
                transform: translateY(-10px);
                box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            }

        .car-img {
            height: 200px;
            object-fit: cover;
        }

        .price-tag {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2ecc71;
        }

        .filter-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: -60px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="hero-bg text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">استأجر سيارة أحلامك الآن</h1>
            <p class="lead">أفضل التشكيلات بأفضل الأسعار في مصر</p>
        </div>
    </div>

    <div class="container">
        <div class="filter-section mb-5">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="searchBox" class="form-control" placeholder="ابحث بالماركة أو الموديل (مثلاً: Tesla)...">
                </div>
                <div class="col-md-3">
                    <input type="number" id="maxPrice" class="form-control" placeholder="أقصى سعر لليوم...">
                </div>
                <div class="col-md-3">
                    <select id="transmission" class="form-select">
                        <option value="">كل أنواع الفتيس</option>
                        <option value="automatic">أوتوماتيك</option>
                        <option value="manual">مانيوال</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100 fw-bold" onclick="loadCars()">بحث</button>
                </div>
            </div>
        </div>

        <div id="loading" class="text-center d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p>جاري تحميل السيارات...</p>
        </div>

        <div class="row g-4" id="carsContainer">
        </div>
    </div>

    <div class="modal fade" id="carDetailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px;">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="modalTitle">اسم السيارة</h5>
                    <button type="button" class="btn-close m-0" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalContent">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const BASE_URL = 'https://localhost:7208/api/Browsing'; // عدل البورت هنا لو مختلف

        async function loadCars() {
            const container = document.getElementById('carsContainer');
            const loader = document.getElementById('loading');

            // جلب قيم الفلاتر
            const search = document.getElementById('searchBox').value;
            const price = document.getElementById('maxPrice').value;
            const trans = document.getElementById('transmission').value;

            loader.classList.remove('d-none');
            container.innerHTML = '';

            try {
                // بناء الـ URL بالـ Query Strings للفلترة
                let url = `${BASE_URL}/filter?search=${search}&maxPrice=${price}&transmission=${trans}`;

                const response = await fetch(url);
                const cars = await response.json();

                loader.classList.add('d-none');

                if (cars.length === 0) {
                    container.innerHTML = '<div class="text-center w-100 mt-5"><h3>مفيش عربيات مطابقة للبحث ده يا ليدر 😅</h3></div>';
                    return;
                }

                cars.forEach(car => {
                    const carCard = `
                            <div class="col-md-4">
                                <div class="card car-card">
                                    <img src="${car.mainImageUrl || 'https://via.placeholder.com/400x250?text=No+Image'}" class="card-img-top car-img" alt="${car.brand}">
                                    <div class="card-body">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <h5 class="card-title fw-bold mb-0">${car.brand} ${car.model}</h5>
                                            <span class="badge bg-info text-dark">${car.year || '2023'}</span>
                                        </div>
                                        <p class="text-muted small">${car.title}</p>
                                        <hr>
                                        <div class="d-flex justify-content-between align-items-center">
                                            <span class="price-tag text-success">${car.rentalPrice} ج.م <small class="text-muted fw-normal">/ يوم</small></span>
                                            <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="showDetails(${car.id})">التفاصيل</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    container.innerHTML += carCard;
                });

            } catch (error) {
                loader.classList.add('d-none');
                console.error("Error:", error);
                alert("تأكد من تشغيل الـ API (البورت 7208) وتفعيل الـ CORS");
            }
        }

        async function showDetails(id) {
            try {
                const response = await fetch(`${BASE_URL}/${id}`);
                const car = await response.json();

                document.getElementById('modalTitle').innerText = `${car.brand} ${car.model}`;
                document.getElementById('modalContent').innerHTML = `
                        <div class="row">
                            <div class="col-md-6">
                               <img src="${car.MainImageUrl || 'https://via.placeholder.com/400x250'}" ...> class="img-fluid rounded-3 mb-3 shadow-sm">
                            </div>
                            <div class="col-md-6">
                                <h4 class="text-primary mb-3">${car.rentalPrice} ج.م <small class="text-muted fs-6">سعر اليوم</small></h4>
                                <ul class="list-group list-group-flush text-end p-0">
                                    <li class="list-group-item"><strong>الموقع:</strong> ${car.location || 'غير محدد'}</li>
                                    <li class="list-group-item"><strong>نوع الفتيس:</strong> ${car.transmission || 'Automatic'}</li>
                                    <li class="list-group-item"><strong>سنة الصنع:</strong> ${car.year || '2023'}</li>
                                    <li class="list-group-item"><strong>وصف إضافي:</strong> ${car.title}</li>
                                </ul>
                                <button class="btn btn-success w-100 mt-4 py-2 fw-bold">احجز هذه السيارة الآن</button>
                            </div>
                        </div>
                    `;

                const modal = new bootstrap.Modal(document.getElementById('carDetailsModal'));
                modal.show();
            } catch (error) {
                alert("مشكلة في جلب بيانات العربية");
            }
        }

        // تحميل السيارات أول ما الصفحة تفتح
        window.onload = loadCars;
    </script>
</body>
</html>
