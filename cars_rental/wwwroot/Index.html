<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Rental | Browse & Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
        }

        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1500');
            background-size: cover;
            padding: 60px 0;
            color: white;
            margin-bottom: 30px;
        }

        .car-card {
            border: none;
            border-radius: 12px;
            transition: 0.3s;
            background: white;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            height: 100%;
        }

            .car-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            }

        .car-img {
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }

        .price-tag {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0d6efd;
        }

        #loading {
            padding: 50px 0;
        }
    </style>
</head>
<body>

    <div class="hero-bg text-center">
        <div class="container">
            <h1 class="fw-bold">Premium Car Rental</h1>
            <p>Select your dates and book your ride instantly</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="card p-3 shadow-sm border-0 mb-4" style="margin-top: -50px;">
            <div class="row g-2">
                <div class="col-md-4"><input type="text" id="searchBox" class="form-control" placeholder="Search Brand/Model..."></div>
                <div class="col-md-3">
                    <select id="carTypeSelect" class="form-select">
                        <option value="">All Types</option>
                        <option value="Sedan">Sedan</option>
                        <option value="SUV">SUV</option>
                        <option value="Sports">Sports</option>
                    </select>
                </div>
                <div class="col-md-3"><input type="text" id="locationBox" class="form-control" placeholder="Location..."></div>
                <div class="col-md-2"><button class="btn btn-primary w-100" onclick="loadCars()">Search</button></div>
            </div>
        </div>

        <div id="loading" class="text-center d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Fetching cars from API...</p>
        </div>
        <div class="row g-4" id="carsContainer"></div>
    </div>

    <div class="modal fade" id="bookingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" style="border-radius: 15px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modalTitle">Car Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalContent"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // تأكد إن البورت 7208 هو بورت الـ API عندك
        const BASE_API_URL = 'https://localhost:7208/api';

        async function loadCars() {
            const container = document.getElementById('carsContainer');
            const loader = document.getElementById('loading');

            // قراءة قيم الفلتر من الصفحة
            const search = document.getElementById('searchBox').value;
            const carType = document.getElementById('carTypeSelect').value;
            const location = document.getElementById('locationBox').value;

            loader.classList.remove('d-none');
            container.innerHTML = '';

            try {
                // بناء الـ URL بالـ Query Parameters للفلترة
                let url = `${BASE_API_URL}/Browsing/filter?`;
                if (search) url += `search=${encodeURIComponent(search)}&`;
                if (carType) url += `carType=${encodeURIComponent(carType)}&`;
                if (location) url += `location=${encodeURIComponent(location)}&`;

                const response = await fetch(url);
                if (!response.ok) throw new Error('API Error');

                const cars = await response.json();
                loader.classList.add('d-none');

                if (cars.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center py-5"><h3>No cars found.</h3></div>';
                    return;
                }

                cars.forEach(car => {
                    container.innerHTML += `
                            <div class="col-md-4">
                                <div class="card car-card">
                                    <img src="${car.mainImageUrl || 'https://via.placeholder.com/400x250'}" class="card-img-top car-img" onerror="this.src='https://via.placeholder.com/400x250'">
                                    <div class="card-body">
                                        <h5 class="fw-bold">${car.brand} ${car.model}</h5>
                                        <p class="text-muted small mb-2">${car.location} | ${car.carType}</p>
                                        <div class="d-flex justify-content-between align-items-center mt-3">
                                            <span class="price-tag">${car.rentalPrice} EGP/day</span>
                                            <button class="btn btn-primary btn-sm px-4 rounded-pill" onclick="showBooking(${car.id})">Book Now</button>
                                        </div>
                                    </div>
                                </div>
                            </div>`;
                });
            } catch (e) {
                loader.classList.add('d-none');
                container.innerHTML = `<div class="alert alert-danger">Error connecting to API. Make sure CORS is enabled.</div>`;
            }
        }

        async function showBooking(id) {
            try {
                const res = await fetch(`${BASE_API_URL}/Browsing/${id}`);
                const car = await res.json();

                document.getElementById('modalTitle').innerText = `Book ${car.brand} ${car.model}`;
                document.getElementById('modalContent').innerHTML = `
                            <div class="row">
                                <div class="col-md-5">
                                    <img src="${car.mainImageUrl || 'https://via.placeholder.com/400x250'}" class="img-fluid rounded shadow-sm">
                                </div>
                                <div class="col-md-7">
                                    <div class="bg-light p-3 rounded">
                                        <h6 class="fw-bold border-bottom pb-2">Rental Request</h6>
                                        <p class="mb-3"><strong>Daily Rate:</strong> ${car.rentalPrice} EGP</p>
                                        <div class="mb-3">
                                            <label class="form-label small fw-bold">Pick-up Date</label>
                                            <input type="date" id="startDate" class="form-control">
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label small fw-bold">Return Date</label>
                                            <input type="date" id="endDate" class="form-control">
                                        </div>
                                        <button class="btn btn-success w-100 fw-bold py-2" onclick="submitBooking(${car.id})">Send Request</button>
                                        <div id="bookingMsg" class="mt-2 small text-center"></div>
                                    </div>
                                </div>
                            </div>`;
                new bootstrap.Modal(document.getElementById('bookingModal')).show();
            } catch (e) { alert("Error fetching car details"); }
        }

        async function submitBooking(carId) {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const msgDiv = document.getElementById('bookingMsg');

            if (!startDate || !endDate) {
                msgDiv.innerHTML = "<span class='text-danger'>Select both dates</span>";
                return;
            }

            try {
                const response = await fetch(`${BASE_API_URL}/Booking/request-rental`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ carId, startDate, endDate })
                });

                const result = await response.text();
                if (response.ok) {
                    msgDiv.innerHTML = `<span class="text-success fw-bold">✅ Success: ${result}</span>`;
                } else {
                    msgDiv.innerHTML = `<span class="text-danger">❌ Failed: ${result}</span>`;
                }
            } catch (error) {
                msgDiv.innerHTML = `<span class="text-danger">Server Error</span>`;
            }
        }

        window.onload = loadCars;
    </script>
</body>
</html>
